<svg viewBox="0 0 1024 768" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo redondeado azul oscuro -->
  <rect width="1024" height="768" fill="#1a3a5e" rx="80"/>
  
  <!-- Neumático/Llanta - Parte Superior -->
  <g transform="translate(512, 200)">
    <!-- Neumático exterior (negro) -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1a1a1a" stroke-width="35"/>
    
    <!-- Detalles de la llanta (surcos) -->
    <line x1="-100" y1="-100" x2="-80" y2="-120" stroke="#2a2a2a" stroke-width="8"/>
    <line x1="-60" y1="-125" x2="-40" y2="-138" stroke="#2a2a2a" stroke-width="8"/>
    <line x1="-10" y1="-142" x2="10" y2="-142" stroke="#2a2a2a" stroke-width="8"/>
    <line x1="60" y1="-125" x2="80" y2="-110" stroke="#2a2a2a" stroke-width="8"/>
    <line x1="100" y1="-95" x2="115" y2="-75" stroke="#2a2a2a" stroke-width="8"/>
    
    <line x1="125" y1="-35" x2="138" y2="-10" stroke="#2a2a2a" stroke-width="8"/>
    <line x1="130" y1="40" x2="140" y2="65" stroke="#2a2a2a" stroke-width="8"/>
    
    <line x1="100" y1="100" x2="85" y2="120" stroke="#2a2a2a" stroke-width="8"/>
    <line x1="60" y1="125" x2="40" y2="138" stroke="#2a2a2a" stroke-width="8"/>
    
    <line x1="-60" y1="125" x2="-80" y2="110" stroke="#2a2a2a" stroke-width="8"/>
    <line x1="-100" y1="95" x2="-120" y2="75" stroke="#2a2a2a" stroke-width="8"/>
    
    <line x1="-135" y1="35" x2="-142" y2="10" stroke="#2a2a2a" stroke-width="8"/>
    <line x1="-130" y1="-40" x2="-138" y2="-65" stroke="#2a2a2a" stroke-width="8"/>
    
    <!-- Centro de la llanta (gris) -->
    <circle cx="0" cy="0" r="60" fill="#4a4a4a"/>
    
    <!-- Decoración del centro -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#3a3a3a" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#ffd700" stroke-width="3"/>
  </g>
  
  <!-- Líneas decorativas amarillas (izquierda) -->
  <rect x="50" y="280" width="120" height="15" fill="#ffd700" rx="7"/>
  <rect x="70" y="315" width="100" height="12" fill="#ffd700" rx="6"/>
  
  <!-- Líneas decorativas amarillas (derecha) -->
  <rect x="854" y="280" width="120" height="15" fill="#ffd700" rx="7"/>
  <rect x="854" y="315" width="100" height="12" fill="#ffd700" rx="6"/>
  
  <!-- RENACER - Texto principal -->
  <text x="512" y="480" font-family="Arial, sans-serif" font-size="140" font-weight="900" text-anchor="middle" fill="#ffd700" letter-spacing="8" style="font-style: italic;">RENACER</text>
  
  <!-- REENCAUCHE DE LLANTAS - Subtítulo -->
  <text x="512" y="570" font-family="Arial, sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="#1a3a5e" letter-spacing="3" style="font-style: italic;">REENCAUCHE DE LLANTAS</text>
</svg>
